<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Как это было</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">

  <!-- ЗАГОЛОВОК В ОБЛАКЕ -->
  <div class="cloud title">
    Как это было…
  </div>

  <!-- ПОДЗАГОЛОВОК -->
  <div class="subtitle">
    11 класс.<br>
    Репетируем сценку к «Последнему Звонку»
  </div>

  <!-- PHOTO 1 -->
  <div class="photo-frame blur">
    <img src="media/photo1.png">
    <div class="overlay"></div>
  </div>

  <!-- ОБЛАКО -->
  <div class="cloud">
    Я сижу и даже представить не могу,<br>
    что меня ждет впереди…
  </div>

  <!-- ТЕКСТ + ФОТО -->
  <div class="row">
    <div class="left-text">
      Здесь мы впервые танцуем
    </div>

    <div class="photo-frame small blur">
      <img src="media/photo2.png">
      <div class="overlay"></div>
    </div>
  </div>

</div>

<script>
document.querySelectorAll('.blur').forEach(el => {
  el.addEventListener('click', () => {
    el.classList.remove('blur');
  });
});
</script>

</body>
</html>
