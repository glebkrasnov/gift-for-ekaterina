<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Как это было...</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrapper">
    <!-- Заголовок -->
    <h1 class="title">Как это было...</h1>

    <h2 class="subtitle">
        11 класс.<br>
        Репетируем сценку к «Последнему Звонку»
    </h2>

    <!-- Фото 1 с блюром -->
    <div class="image-wrapper" onclick="revealPhoto(this)">
        <img src="photo1.png" class="photo blurred" alt="Фото 1">
        <div class="blur-overlay">Нажми</div>
    </div>

    <!-- Подпись под фото 1 -->
    <div class="caption light-brown">
        Я сижу и даже представить не могу, что меня ждет впереди...
    </div>

    <!-- Блок с текстом слева и фото справа -->
    <div class="row">
        <div class="text">
            Здесь мы впервые танцуем
        </div>
        <div class="image-wrapper" onclick="revealPhoto(this)">
            <img src="photo2.png" class="photo blurred" alt="Фото 2">
            <div class="blur-overlay">Нажми</div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
